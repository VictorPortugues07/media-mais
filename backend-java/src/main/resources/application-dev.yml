spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mediamais?currentSchema=public}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: MediaMaisHikariPool

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.mediamais.platform: DEBUG
    org.springframework.security: INFO
