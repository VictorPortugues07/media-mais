server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mediamais-platform-api
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope: openid, profile, email

# Cloudflare R2 Config
cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:dummy-account-id}
    access-key: ${R2_ACCESS_KEY:dummy-access-key}
    secret-key: ${R2_SECRET_KEY:dummy-secret-key}
    bucket-name: ${R2_BUCKET_NAME:mediamais-midias}
    cdn-base-url: ${R2_CDN_URL:https://media.mediamais.com.br}

# AbacatePay Config
abacatepay:
  api-url: ${ABACATEPAY_API_URL:https://api.abacatepay.com/v1}
  api-key: ${ABACATEPAY_API_KEY:dummy-abacate-key}
  webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:dummy-webhook-secret}

# Segurança dos Tokens da TV e Sessão
security:
  jwt:
    tv-secret: ${TV_JWT_SECRET:mediamais_super_tv_secret_2026_super_seguro_min_32_chars}
    session-secret: ${SESSION_JWT_SECRET:mediamais_super_user_secret_2026_super_seguro_min_32_chars}
